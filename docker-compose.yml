services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: growcircle_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: growcircle
      POSTGRES_PASSWORD: growcircle_dev
      POSTGRES_DB: growcircle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growcircle -d growcircle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: growcircle_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: growcircle_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://growcircle:growcircle_dev@postgres:5432/growcircle_db
      - DATABASE_SYNC_URL=postgresql://growcircle:growcircle_dev@postgres:5432/growcircle_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: growcircle_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.jobs.celery_app.celery", "worker", "--loglevel=info"]
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://growcircle:growcircle_dev@postgres:5432/growcircle_db
      - DATABASE_SYNC_URL=postgresql://growcircle:growcircle_dev@postgres:5432/growcircle_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - DATA_GOV_API_KEY=${DATA_GOV_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: growcircle_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "backend.app.jobs.celery_app.celery", "beat", "--loglevel=info"]
    environment:
      - ENVIRONMENT=development
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
