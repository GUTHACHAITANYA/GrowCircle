<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 240" width="100%" height="100%" role="img" aria-label="GrowCircle Logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&amp;display=swap');
      .wordmark {
        font-family: 'Baloo 2', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, cursive, sans-serif;
        font-weight: 800;
        font-size: 104px;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- Clear space padding: Leaf width ~45px -->
  <g transform="translate(20, 20)">
    <!-- Scaled Mark: 200x200 (scale: 200/512 = 0.390625) -->
    <g transform="scale(0.390625)">
      <!-- 23% corner radius container in Deep Leaf #1F6B3A -->
      <rect width="512" height="512" rx="118" ry="118" fill="#1F6B3A" />

      <!-- White Open Circle Arc (C open to the right) -->
      <path
        d="M 350 176
           A 130 130 0 1 0 350 336"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="44"
        stroke-linecap="round"
      />

      <!-- Harvest Gold Leaf forming the G bar -->
      <path
        d="M 238 256
           C 238 214, 308 206, 370 216
           C 382 248, 386 288, 334 306
           C 286 322, 246 292, 238 256 Z"
        fill="#F6C343"
      />
      <path
        d="M 248 260
           Q 302 258 358 238"
        fill="none"
        stroke="#1F6B3A"
        stroke-width="7"
        stroke-linecap="round"
      />
    </g>

    <!-- Wordmark: Baloo 2 ExtraBold. G & C in Amber #C77700, remainder in Deep Leaf #1F6B3A -->
    <text x="240" y="142" class="wordmark" dominant-baseline="middle">
      <tspan fill="#C77700">G</tspan><tspan fill="#1F6B3A">row</tspan><tspan fill="#C77700">C</tspan><tspan fill="#1F6B3A">ircle</tspan>
    </text>
  </g>
</svg>
