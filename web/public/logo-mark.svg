<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-label="GrowCircle Logo Mark">
  <defs>
    <!-- Smooth clip path for inner elements if needed -->
    <clipPath id="mark-clip">
      <rect width="512" height="512" rx="118" ry="118" />
    </clipPath>
  </defs>

  <!-- Container: 23% corner radius rounded square in Deep Leaf green -->
  <rect width="512" height="512" rx="118" ry="118" fill="#1F6B3A" />

  <!-- The White Open Circle Arc (C open to the right) -->
  <!-- Center (248, 256), Radius 130, Stroke 44px. Gap from ~ -38 deg to +38 deg -->
  <path
    d="M 350 176
       A 130 130 0 1 0 350 336"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="44"
    stroke-linecap="round"
  />

  <!-- The Harvest Gold Leaf across the opening, creating the 'G' horizontal reading -->
  <!-- Anchored from bottom-right of arc (around 320, 310) reaching inward to (260, 256) -->
  <g id="leaf-element">
    <!-- Leaf body in Harvest Gold #F6C343 -->
    <path
      d="M 238 256
         C 238 214, 308 206, 370 216
         C 382 248, 386 288, 334 306
         C 286 322, 246 292, 238 256 Z"
      fill="#F6C343"
    />
    <!-- Leaf central vein / inner rib in Deep Leaf #1F6B3A for agricultural clarity -->
    <path
      d="M 248 260
         Q 302 258 358 238"
      fill="none"
      stroke="#1F6B3A"
      stroke-width="7"
      stroke-linecap="round"
    />
  </g>
</svg>
